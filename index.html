    <script>
      // Delay the LeadConnector chat widget by 30 seconds, then fade it in.
      (function () {
        var style = document.createElement("style");
        style.textContent =
          "chat-widget{opacity:0;transition:opacity .4s ease;pointer-events:none}" +
          "html.lc-chat-ready chat-widget{opacity:1;pointer-events:auto}";
        document.head.appendChild(style);
        window.setTimeout(function () {
          var s = document.createElement("script");
          s.src = "https://widgets.leadconnectorhq.com/loader.js";
          s.setAttribute(
            "data-resources-url",
            "https://widgets.leadconnectorhq.com/chat-widget/loader.js"
          );
          s.setAttribute("data-widget-id", "6a39d33d5dcabc40b521bb0e");
          s.onload = function () {
            window.setTimeout(function () {
              document.documentElement.classList.add("lc-chat-ready");
            }, 300);
          };
          document.body.appendChild(s);
        }, 30000);
      })();
    </script>
  </body>
